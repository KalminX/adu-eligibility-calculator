{% extends "base.html" %}

{% block title %}Staff Login{% endblock %}

{% block content %}
<div class="py-16 max-w-md mx-auto px-4 sm:px-6">
  <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
    
    <div class="text-center mb-6">
      <div class="w-10 h-10 rounded-lg bg-blue-600 text-white mx-auto flex items-center justify-center mb-3">
        <!-- Lucide Shield -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-slate-900">Staff &amp; Admin Sign In</h1>
      <p class="text-xs text-slate-500 mt-1">Access the ADU lead pipeline and admin dashboard</p>
    </div>

    {% if form.errors %}
      <div class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-800 text-xs">
        Invalid username or password. Please try again.
      </div>
    {% endif %}

    <form method="post" action="{% url 'admin:login' %}" class="space-y-4">
      {% csrf_token %}
      
      <div>
        <label for="id_username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Username</label>
        <input type="text" name="username" id="id_username" required autofocus class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition">
      </div>

      <div>
        <label for="id_password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
        <input type="password" name="password" id="id_password" required class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-sm text-slate-900 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition">
      </div>

      <input type="hidden" name="next" value="{{ next|default:'/admin/' }}">

      <button type="submit" class="w-full mt-2 inline-flex items-center justify-center px-4 py-2.5 border border-transparent text-sm font-semibold rounded-lg text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition">
        Sign In to Portal
      </button>
    </form>

  </div>
</div>
{% endblock %}
